name: Release

# Push a tag like v0.3.0 to publish to PyPI. No API token is stored anywhere: PyPI trusts this
# workflow through OpenID Connect ("trusted publishing"; set it up once at pypi.org, see
# docs/RELEASING.md).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The tag must match the package version
        run: |
          v=$(python - <<'P'
          import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])
          P
          )
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: The built wheel installs and runs from a clean tool environment
        run: |
          pip install uv
          REVERIE_SRC=$(ls $PWD/dist/*.whl) sh scripts/install.sh
          ~/.local/bin/reverie --version
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
