name: Feature request
description: Propose an improvement to Reverie
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Please check existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering task is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you want to happen, and why it fits "extraction over storage" and "demand-driven, not proactive".
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
