name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, agent used (OpenCode, Claude Code, Cursor, Codex), and relevant output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show engineering-cognition` and OS.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant log output. Do NOT paste API keys or private code. The brain at ~/.ec/ec.db may contain private engineering conclusions — do not attach it.
