[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reverie-mem"
version = "0.3.0"
description = "Engineering memory for coding agents — conclusions, not logs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["claude-code", "codex", "cursor", "opencode", "mcp", "agent-memory", "coding-agents", "developer-tools"]
authors = [{ name = "Mudit Sarda", email = "mudit@muditsarda.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "numpy",
    "onnxruntime",
    "tokenizers",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=2.0", "types-PyYAML",
       "scikit-learn", "scipy", "hdbscan>=0.8.33"]
# Only the legacy conclusion-clustering task uses these; without them it is skipped.
cluster = ["scikit-learn", "scipy", "hdbscan>=0.8.33"]
# The embedding model also runs on PyTorch if you prefer it (same vectors, ~1 GB larger).
torch = ["sentence-transformers>=3.0.1"]

[project.urls]
Homepage = "https://reverie.muditsarda.com/"
Repository = "https://github.com/muditsarda1122/Reverie.git"
Issues = "https://github.com/muditsarda1122/Reverie/issues"

[project.scripts]
reverie = "reverie.cli:main"
reverie-mcp = "reverie.mcp_server:main"
reverie-claude-hook = "reverie.integrations.claude.shim:main"
reverie-opencode-hook = "reverie.integrations.opencode.shim:main"
reverie-codex-hook = "reverie.integrations.codex.shim:main"

[tool.setuptools.packages.find]
include = ["reverie*"]

[tool.setuptools.package-data]
reverie = ["prompts/*.md", "schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["demo", "starlette-baseline", "runs", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "F",   # pyflakes
]
ignore = [
    "E501", # long lines — existing codebase style, no logic-safe autofix
]

[tool.ruff.lint.isort]
known-first-party = ["reverie"]

[tool.mypy]
python_version = "3.12"
files = ["reverie"]

[[tool.mypy.overrides]]
module = ["hdbscan", "scipy.*", "onnxruntime", "tokenizers", "sentence_transformers"]
ignore_missing_imports = true
